version: "3.9"

# Usage:
#   Standard:          docker-compose --env-file docker/.env up
#   With Langfuse:     docker-compose --env-file docker/.env --profile langfuse up
#   API only:          docker-compose --env-file docker/.env up api qdrant postgres

services:

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: uro-rag-api
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Service-discovery overrides (Docker internal hostnames)
      QDRANT_URL: http://qdrant:6333
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data        # ingestion outputs, eval results, metadata cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    labels:
      # Scheduled jobs that run INSIDE this container. ofelia reads job-exec
      # labels from the target container, not from its own, and only when
      # ofelia.enabled is true. Schedules are 6-field cron (leading seconds);
      # 5-field is rejected at registration.
      ofelia.enabled: "true"

      # Step 1 (01:00 UTC): refresh the regulatory withdrawal database, an hour
      # before ingestion so newly withdrawn drugs are flagged in answers
      # produced after the 08:00 restart.
      ofelia.job-exec.regulatory-db-update.schedule: "0 0 1 * * 0"
      ofelia.job-exec.regulatory-db-update.command: "python scripts/update_regulatory_db.py"

      # Step 2 (02:00 UTC): ingest the past week, then rebuild the BM25 cache
      # so the 08:00 restart loads in seconds rather than re-scrolling the
      # whole collection.
      ofelia.job-exec.weekly-ingestion.schedule: "0 0 2 * * 0"
      ofelia.job-exec.weekly-ingestion.command: >-
        sh -c "python -m src.ingestion.pipeline --since-days 7 --limit 2000 &&
        python scripts/rebuild_bm25_cache.py"
    networks:
      - rag-net

  # ── Streamlit UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: uro-rag-ui
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      API_BACKEND_URL: http://api:8000
    ports:
      # Loopback only: the Streamlit UI has no authentication of its own, and
      # the board-facing client is uro-rag-web on Vercel, which talks to the
      # API directly. Reach this over an SSH tunnel when it is running.
      - "127.0.0.1:8501:8501"
    volumes:
      - ../rag_ui.py:/app/rag_ui.py   # hot-reload UI during development
    command:
      - streamlit
      - run
      - rag_ui.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    restart: unless-stopped
    networks:
      - rag-net

  # ── Qdrant vector store ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: uro-rag-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      # Loopback only. Every consumer reaches Qdrant over the rag-net bridge at
      # http://qdrant:6333, so nothing needs a published port; "6333:6333"
      # binds 0.0.0.0 and put an unauthenticated vector store, with full read
      # and write access to the corpus, on the open internet. Confirmed
      # reachable from outside on 2026-09-21, returning HTTP 200 on
      # /collections with no credentials.
      #
      # A host firewall is not a substitute: Docker inserts its own iptables
      # rules ahead of ufw's, so published ports stay reachable even with ufw
      # enabled unless DOCKER-USER is configured explicitly.
      - "127.0.0.1:6333:6333"   # REST API, loopback only
      - "127.0.0.1:6334:6334"   # gRPC, loopback only
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-net

  # ── PostgreSQL — document store, BM25, audit log ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uro-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only. The API reaches Postgres over rag-net at postgres:5432.
      # "5432:5432" bound 0.0.0.0, exposing a database holding the audit log --
      # every question asked, and for treatment cards the patient's clinical
      # history and identifier -- to the open internet, with the credentials
      # POSTGRES_USER/POSTGRES_PASSWORD set to rag/rag a few lines below.
      #
      # Reach it for maintenance over an SSH tunnel, or with
      # `docker exec uro-rag-postgres psql -U rag -d rag`.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-net

  # ── Weekly incremental ingestion ─────────────────────────────────────────────
  #
  # Start with:  docker compose --profile ingestion-cron up -d
  #
  # This profile had never been started in production, so no scheduled run has
  # ever happened. When it was first brought up (2026-09-21) every job failed
  # to register and ofelia crash-looped on "unable to start a empty scheduler".
  # Three separate defects, all fixed below:
  #
  #   1. Schedules were 5-field cron ("0 2 * * 0"). ofelia requires 6 fields,
  #      leading with seconds. A 5-field schedule is rejected silently at
  #      registration -- the job simply never exists.
  #   2. Jobs used `job-run` with a `container` argument. job-exec is the
  #      documented way to run a command in an already-running container; its
  #      labels live on the TARGET container, which also needs
  #      ofelia.enabled=true. See the api service above.
  #   3. The restart job shelled out to curl against the Docker socket, and
  #      the ofelia image contains neither curl nor the Docker CLI. It now
  #      runs `docker restart` from a docker:cli container with the socket
  #      mounted.
  #
  # Ordering: regulatory refresh, then ingestion, then a cache rebuild inside
  # the ingestion job, then the restart. The rebuild matters -- the BM25 cache
  # is keyed on the collection's point count, so ingestion makes it stale, and
  # without a rebuild the restart re-scrolls the whole collection inline and
  # takes minutes instead of seconds.
  ingestion-cron:
    image: mcuadros/ofelia:latest
    container_name: uro-rag-ingestion-cron
    profiles: [ingestion-cron]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      # Step 3 (08:00 UTC): restart the API so it loads the rebuilt BM25 cache.
      # job-run, because it needs a container that has the Docker CLI.
      ofelia.job-run.restart-api.schedule: "0 0 8 * * 0"
      ofelia.job-run.restart-api.image: "docker:cli"
      ofelia.job-run.restart-api.volume: "/var/run/docker.sock:/var/run/docker.sock"
      ofelia.job-run.restart-api.command: "docker restart uro-rag-api"
      ofelia.job-run.restart-api.delete: "true"
    restart: unless-stopped
    networks:
      - rag-net

  # ── Langfuse — self-hosted distributed tracing (optional profile) ─────────────
  #
  # Start with:  docker-compose --profile langfuse up
  # Then set LANGFUSE_HOST=http://langfuse:3000 in docker/.env
  # UI available at:  http://localhost:3000
  langfuse:
    image: langfuse/langfuse:2
    container_name: uro-rag-langfuse
    profiles: [langfuse]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-in-production}
      SALT: ${LANGFUSE_SALT:-changeme-in-production}
      TELEMETRY_ENABLED: "false"
    ports:
      # Loopback only; reach the Langfuse UI over an SSH tunnel.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - rag-net

volumes:
  qdrant_storage:
    driver: local
  postgres_data:
    driver: local

networks:
  rag-net:
    driver: bridge
